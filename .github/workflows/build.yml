name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          mkdir -p proj
          if [ -f project.zip ]; then unzip -q -o project.zip -d proj; else cp -r . proj 2>/dev/null || true; fi
          ls proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release with APK link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مشغل الموسيقى - نسخة ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
