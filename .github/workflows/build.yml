name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q -o project.zip -d proj
          ls proj

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: proj
        run: |
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors only
        if: failure()
        working-directory: proj
        run: |
          grep -n -B2 -A12 -E "^e: |What went wrong|error:|FAILED" build.log | head -80

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Music Player build ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
